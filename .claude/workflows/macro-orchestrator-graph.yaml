# Macro Orchestrator Workflow v1.0
# Workflow-of-Workflows: clasifica tarea, activa workflow, delega, valida
#
# CONCEPTO: Un macro-workflow NO ejecuta sub-workflows directamente
# (limitacion: un graph activo por proyecto). En vez:
# 1. Clasifica la tarea entrante
# 2. Activa el workflow apropiado via graph_activate
# 3. Delega a un agent o instruye ejecucion manual
# 4. Valida el resultado
# 5. Decide si continuar o finalizar
#
# LIMITACION Y WORKAROUND:
# - Solo un graph activo por proyecto a la vez
# - Al activar otro graph, este macro se desactiva
# - Workaround: El nodo "delegate" instruye al modelo a ejecutar
#   el sub-workflow paso a paso usando tools de workflow-manager,
#   luego re-activar el macro para continuar

metadata:
  name: "Macro Orchestrator"
  description: "Meta-workflow que clasifica tareas y delega a workflows especializados. Patron workflow-of-workflows."
  version: "1.0.0"
  type: "graph"
  author: "AgentCockpit"
  mcps_required:
    - "workflow-manager"

nodes:
  # ---------------------------------------------------------------------------
  # PASO 1: CLASIFICAR TAREA
  # ---------------------------------------------------------------------------
  - id: "classify-task"
    name: "Clasificar Tarea"
    is_start: true
    mcps_enabled:
      - "workflow-manager"
    tools_blocked:
      - "Write"
      - "Edit"
      - "Bash"
    max_visits: 5
    prompt_injection: |
      ======================================================================
      MACRO ORCHESTRATOR - PASO 1: CLASIFICAR TAREA
      ======================================================================

      Clasifica la tarea del usuario en una de estas categorias:

      1. "code quality" — Analisis de calidad, smells, deuda, refactoring
         → Workflow: dcc-code-quality-graph
         → Agent: codebase-analyst

      2. "landing page" — Crear landing page desde cero
         → Workflow: landing-generator-graph
         → Agent: ui-master / layout-architect

      3. "web analysis" — Analizar y recrear pagina web existente
         → Workflow: denofresh-analyzer-graph
         → Agent: ui-master

      4. "seo optimize" — Optimizar SEO de sitio existente
         → Workflow: fresh-seo-optimizer-graph
         → Agent: integration-tester

      5. "landing materials" — Crear landing desde materiales existentes
         → Workflow: landing-from-materials-graph
         → Agent: layout-architect

      6. "custom" — Tarea que no encaja en workflows existentes
         → Sin workflow, ejecucion libre

      USA graph_list_available para confirmar que el workflow existe.

      SIGNAL: Di la categoria detectada (ej: "code quality", "landing page")

      ======================================================================

  # ---------------------------------------------------------------------------
  # PASO 2: ACTIVAR WORKFLOW
  # ---------------------------------------------------------------------------
  - id: "activate-workflow"
    name: "Activar Workflow Especializado"
    mcps_enabled:
      - "workflow-manager"
    tools_blocked:
      - "Write"
      - "Edit"
      - "Bash"
      - "Task"
    max_visits: 5
    prompt_injection: |
      ======================================================================
      MACRO ORCHESTRATOR - PASO 2: ACTIVAR WORKFLOW
      ======================================================================

      Activa el workflow correspondiente a la categoria clasificada.

      HERRAMIENTAS:
      - graph_list_available: Confirmar disponibilidad
      - graph_activate: Activar el workflow

      IMPORTANTE: Al activar otro workflow, este macro-orchestrator
      se desactiva. Esto es esperado. El nuevo workflow tomara el control.

      INSTRUCCIONES POST-ACTIVACION:
      1. Activa el workflow con graph_activate
      2. El flujo ahora lo controla el nuevo workflow
      3. Usa /workflow status para ver estado
      4. Usa /workflow advance o responde a los prompts del nodo

      SIGNAL: Cuando actives el workflow, di "workflow activado"

      ======================================================================

  # ---------------------------------------------------------------------------
  # PASO 3: DELEGAR A AGENT
  # ---------------------------------------------------------------------------
  - id: "delegate-to-agent"
    name: "Delegar a Agent Especializado"
    mcps_enabled:
      - "*"
    max_visits: 3
    prompt_injection: |
      ======================================================================
      MACRO ORCHESTRATOR - PASO 3: DELEGAR A AGENT
      ======================================================================

      Si el workflow fue activado, este nodo no se alcanza (el workflow
      tomo control). Este nodo es para el caso "custom" donde no hay
      workflow especializado.

      Para tareas custom:
      1. Usa el Task tool para delegar a un sub-agent apropiado
      2. Elige el agent segun la tarea:
         - ui-master: tareas UI complejas
         - component-builder: componentes individuales
         - form-specialist: formularios
         - layout-architect: layouts
         - animation-designer: animaciones
         - integration-tester: testing
         - codebase-analyst: analisis de codigo

      SIGNAL: Cuando el agent termine, di "delegacion completa"

      ======================================================================

  # ---------------------------------------------------------------------------
  # PASO 4: VALIDAR RESULTADO
  # ---------------------------------------------------------------------------
  - id: "validate-result"
    name: "Validar Resultado"
    mcps_enabled:
      - "*"
    max_visits: 5
    prompt_injection: |
      ======================================================================
      MACRO ORCHESTRATOR - PASO 4: VALIDAR RESULTADO
      ======================================================================

      Valida que el resultado de la delegacion es correcto.

      CHECKS:
      1. El sub-agent/workflow completo su tarea?
      2. Los archivos creados/modificados existen?
      3. No hay errores de TypeScript? (usar Bash: npx tsc --noEmit)
      4. El resultado cumple con lo solicitado?

      Si hay problemas: "necesita correccion"
      Si todo OK: "resultado validado"

      ======================================================================

  # ---------------------------------------------------------------------------
  # PASO 5: FINALIZAR
  # ---------------------------------------------------------------------------
  - id: "done"
    name: "Tarea Completa"
    is_end: true
    mcps_enabled:
      - "*"
    max_visits: 1
    prompt_injection: |
      ======================================================================
      MACRO ORCHESTRATOR - COMPLETADO
      ======================================================================

      Presenta resumen al usuario:
      1. Que tarea se clasifico
      2. Que workflow/agent se uso
      3. Resultado obtenido
      4. Archivos creados/modificados

      ======================================================================

# =============================================================================
# EDGES
# =============================================================================

edges:
  # classify → activate (para categorias con workflow)
  - id: "classify-to-activate"
    from: "classify-task"
    to: "activate-workflow"
    condition:
      type: "phrase"
      phrases:
        - "code quality"
        - "landing page"
        - "web analysis"
        - "seo optimize"
        - "landing materials"
    priority: 1

  # classify → delegate (para custom sin workflow)
  - id: "classify-to-delegate"
    from: "classify-task"
    to: "delegate-to-agent"
    condition:
      type: "phrase"
      phrases:
        - "custom"
    priority: 2

  # activate → done (workflow toma control, macro termina)
  - id: "activate-to-done"
    from: "activate-workflow"
    to: "done"
    condition:
      type: "phrase"
      phrases:
        - "workflow activado"
        - "workflow activated"
    priority: 1

  # delegate → validate
  - id: "delegate-to-validate"
    from: "delegate-to-agent"
    to: "validate-result"
    condition:
      type: "phrase"
      phrases:
        - "delegacion completa"
        - "delegation complete"
    priority: 1

  # validate → done (success)
  - id: "validate-to-done"
    from: "validate-result"
    to: "done"
    condition:
      type: "phrase"
      phrases:
        - "resultado validado"
        - "result validated"
    priority: 1

  # validate → delegate (retry)
  - id: "validate-to-delegate"
    from: "validate-result"
    to: "delegate-to-agent"
    condition:
      type: "phrase"
      phrases:
        - "necesita correccion"
        - "needs correction"
    priority: 2
